name = "hex-gram-schmidt-bench"
defaultTargets = ["hexgramschmidt_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGramSchmidt"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_exe]]
name = "hexgramschmidt_bench"
root = "HexGramSchmidt.Bench"
